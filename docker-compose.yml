services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archivedb
    volumes:
      - archive-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archivedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./fastapi
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/archivedb
      SECRET_KEY: ${SECRET_KEY:-LyaytZkuVqR8k452}
      PUBLIC_API_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  archive-db:
